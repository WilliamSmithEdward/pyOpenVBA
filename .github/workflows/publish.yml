name: Publish

# A version tag publishes to PyPI and creates the GitHub release. Started by
# hand, it is a dry run unless dry_run is unticked: it builds, scans and
# assembles the release files exactly as a release would, and uploads them as
# the release-preview artifact instead of publishing anything.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, scan and assemble the release, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag '$TAG' does not match pyproject.toml version '$PKG'"
            exit 1
          fi
          echo "Version check passed: $PKG"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r .github/requirements/build.txt

      - name: Build sdist + wheel
        run: python -m build --no-isolation

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The tagged commit's scans. A finding the accepted list does not account
  # for fails this job, and nothing is published.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ClamAV and YARA-X over the tagged commit's files, held to their own
  # accepted list the same way.
  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: [build, security, malware-scan]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pyOpenVBA/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # On a dry run `publish` is skipped; this job still assembles the release
  # and uploads it as an artifact, and only the last step is skipped.
  github-release:
    name: Create GitHub release
    needs: [build, publish, security, malware-scan]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.security.result == 'success' && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success'
      || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download the security report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-report/

      - name: Download the malware report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report
          path: security-report/

      # Both reports and what they were made from, named for the release:
      # pyopenvba-6.4.0-security-report.md, pyopenvba-6.4.0-semgrep.sarif,
      # pyopenvba-6.4.0-malware-report.md, pyopenvba-6.4.0-clamav.json.
      - name: Name the reports after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$DRY_RUN" = true ]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          for file in security-report/*; do
            mv "$file" "security-report/pyopenvba-$VERSION-$(basename "$file")"
          done

      - name: Extract changelog section for this tag
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$DRY_RUN" = true ]; then
            TAG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          if [ -f docs/changelog.md ]; then
            awk -v ver="$TAG" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' docs/changelog.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG" > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            security-report/
            release_notes.md
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/*
            security-report/*
          fail_on_unmatched_files: true
