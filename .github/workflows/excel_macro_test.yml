name: Build Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/fixtures/excel/**'
      - 'scripts/build_excel_fixtures.py'
      - 'scripts/run_excel_fixtures.py'
      - 'scripts/utils/**'
      - '.github/workflows/excel_macro_test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/fixtures/excel/**'
      - 'scripts/build_excel_fixtures.py'
      - 'scripts/run_excel_fixtures.py'
      - 'scripts/utils/**'
      - '.github/workflows/excel_macro_test.yml'

jobs:
  test:
    name: Build and test Excel fixtures
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Excel fixtures
        run: python scripts/build_excel_fixtures.py

      - name: Setup VBA
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Install pywin32
        shell: pwsh
        run: |
          pip install pywin32
          python -m Scripts.pywin32_postinstall -install

      - name: Run Excel macros and verify output
        timeout-minutes: 1
        run: python scripts/run_excel_fixtures.py

      - name: Take screenshot on failure
        if: failure()
        shell: pwsh
        run: |
          . "${{ github.workspace }}/scripts/utils/Screenshot.ps1"
          . "${{ github.workspace }}/scripts/utils/Minimize.ps1"
          . "${{ github.workspace }}/scripts/utils/MinimizeCurrentWindow.ps1"
          . "${{ github.workspace }}/scripts/utils/ListVisibleWindows.ps1"
          
          $screenshotDir = "${{ github.workspace }}/screenshots"
          if (!(Test-Path -Path $screenshotDir)) {
            New-Item -ItemType Directory -Path $screenshotDir -Force | Out-Null
          }

          Write-VisibleWindowsReport -OutputPath "$screenshotDir/failure_visible_windows_before.txt" -Header "Visible windows before failure screenshot"
          
          Minimize-Window "HostedComputeAgent"
          Minimize-Window "Administrator"
          Minimize-CurrentWindow
          Start-Sleep -Seconds 1
          Take-Screenshot -OutputPath "$screenshotDir/failure_screenshot.png"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: ./screenshots/
          if-no-files-found: warn

  test-window-minimization:
    name: Test window minimization on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: List all windows and minimize test
        shell: pwsh
        run: |
          . "${{ github.workspace }}/scripts/utils/Minimize.ps1"
          . "${{ github.workspace }}/scripts/utils/Screenshot.ps1"
          . "${{ github.workspace }}/scripts/utils/MinimizeCurrentWindow.ps1"
          . "${{ github.workspace }}/scripts/utils/ListVisibleWindows.ps1"
          
          Write-Host "=== BEFORE MINIMIZATION ===" -ForegroundColor Cyan
          $processes = Get-Process | Where-Object { $_.MainWindowHandle -ne 0 }
          $processes | ForEach-Object { Write-Host "  - $($_.ProcessName): $($_.MainWindowTitle)" }

          $screenshotDir = "${{ github.workspace }}/screenshots"
          New-Item -ItemType Directory -Path $screenshotDir -Force | Out-Null
          Write-VisibleWindowsReport -OutputPath "$screenshotDir/minimize_test_visible_windows_before.txt" -Header "Visible windows before minimization test screenshot"
          
          Write-Host "`n=== ATTEMPTING MINIMIZATION ===" -ForegroundColor Cyan
          Minimize-Window "cmd"
          Minimize-Window "Administrator"
          Minimize-Window "HostedComputeAgent"
          Minimize-CurrentWindow
          
          Start-Sleep -Seconds 2
          
          Write-Host "`n=== TAKING SCREENSHOT ===" -ForegroundColor Cyan
          Take-Screenshot -OutputPath "$screenshotDir/minimize_test_screenshot.png"
          
          Write-Host "`n=== AFTER SCREENSHOT ===" -ForegroundColor Cyan
          $processes = Get-Process | Where-Object { $_.MainWindowHandle -ne 0 }
          $processes | ForEach-Object { Write-Host "  - $($_.ProcessName): $($_.MainWindowTitle)" }

      - name: Upload minimization test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimization-test-screenshot
          path: ./screenshots/
          if-no-files-found: warn

