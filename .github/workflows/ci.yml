name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Minor versions, not patches: the matrix tests each supported
        # Python as users install it, at its newest patch release. The dev
        # tools are ranges in pyproject.toml for the same reason: a library
        # keeps ranges for the people who install it.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Extra OS coverage on one stable Python version.
          - os: windows-2025
            python-version: "3.12"
          - os: macos-26
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run Pyright (strict)
        run: pyright src tests

      - name: Run pytest
        run: pytest -p no:randomly -q

  # Non-ASCII text through the real engine for every supported code page
  # (the issue-#11 bug class): Thai, Japanese, Chinese (both), Korean,
  # Cyrillic, Greek, Turkish, Hebrew, Arabic, Vietnamese, and friends,
  # each a full write -> read -> list -> validate cycle on a file whose
  # PROJECTCODEPAGE is that page.  Both write paths are swept: the Excel
  # one through a workbook, and the Access one through a database, which
  # read no code page at all until issue #18.  Split out from the matrix
  # above so a code-page regression names its own OS instead of hiding
  # inside a general run, and mirrors the job in the xlide_vscode port.
  languages:
    name: VBA language tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run language matrix
        run: pytest tests/test_language_matrix.py -p no:randomly -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -r .github/requirements/build.txt

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The one check branch protection requires. The matrix jobs are named
  # after their Python and runner, which change; this name does not. It
  # fails unless every job above passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, languages, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
