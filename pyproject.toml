[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyOpenVBA"
version = "5.1.1"
description = "Read and write VBA macros and Excel Power Query in pure Python, no dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "William Smith", email = "williamsmithe@icloud.com" },
]
keywords = [
    "vba",
    "power-query",
    "powerquery",
    "m-language",
    "datamashup",
    "excel",
    "word",
    "powerpoint",
    "access",
    "accdb",
    "mdb",
    "xlsm",
    "xlsb",
    "xls",
    "xlam",
    "docm",
    "pptm",
    "ms-ovba",
    "ms-cfb",
    "macros",
    "office",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyright>=1.1.350",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/WilliamSmithEdward/pyOpenVBA"
Repository = "https://github.com/WilliamSmithEdward/pyOpenVBA"
Issues = "https://github.com/WilliamSmithEdward/pyOpenVBA/issues"
Documentation = "https://github.com/WilliamSmithEdward/pyOpenVBA#readme"

[project.scripts]
pyopenvba = "pyopenvba.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyopenvba"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyopenvba",
    "README.md",
    "LICENSE.md",
    "pyproject.toml",
    "docs/architecture.md",
    "docs/power_query.md",
    "docs/roadmap.md",
    "docs/ms-ovba-implementation-guide_v2.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "RUF", "PIE", "C4", "PERF", "N", "TC", "RET", "TRY"]
# Ignore rules that conflict with the project's strict-pyright typing posture,
# intentional MS-spec naming, or stylistic preferences:
#   B009    getattr(obj, "_private")  -- deliberate to bypass reportPrivateUsage in tests
#   PIE807  default_factory=lambda: [] -- pyright strict cannot infer element type from bare `list`
#   TRY003  raising vanilla exception messages is fine in this project
#   E501    long lines are tolerated where they aid readability of binary specs
#   N801/N802/N806  mixed-case names mirror MS-OVBA spec record/field names
#   PERF203 try/except inside loops is required for per-row recovery in parsers
#   PERF401 manual list builds are clearer than comprehensions in spec-driven code
#   SIM105  contextlib.suppress is slower; explicit try/except is preferred
#   TRY300  try-else is stylistic
#   TC001/TC003  moving runtime-required imports into TYPE_CHECKING risks breakage
ignore = [
    "B009",
    "PIE807",
    "TRY003",
    "E501",
    "N801",
    "N802",
    "N806",
    "PERF203",
    "PERF401",
    "SIM105",
    "TRY300",
    "TC001",
    "TC003",
]
