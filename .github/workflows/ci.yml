name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Extra OS coverage on one stable Python version.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Pyright (strict)
        run: pyright src tests

      - name: Run pytest
        run: pytest -p no:randomly -q

  # Non-ASCII text through the real engine for every supported code page
  # (the issue-#11 bug class): Thai, Japanese, Chinese (both), Korean,
  # Cyrillic, Greek, Turkish, Hebrew, Arabic, Vietnamese, and friends,
  # each a full write -> read -> list -> validate cycle on a file whose
  # PROJECTCODEPAGE is that page.  Both write paths are swept: the Excel
  # one through a workbook, and the Access one through a database, which
  # read no code page at all until issue #18.  Split out from the matrix
  # above so a code-page regression names its own OS instead of hiding
  # inside a general run, and mirrors the job in the xlide_vscode port.
  languages:
    name: Language matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run language matrix
        run: pytest tests/test_language_matrix.py -p no:randomly -q

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
